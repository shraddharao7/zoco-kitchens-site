document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

pacity:1;transform:none}}\n  @keyframes zc-fade{from{opacity:0}to{opacity:1}}\n  @keyframes zc-draw{to{stroke-dashoffset:0}}\n  @keyframes zc-pop{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}\n  @keyframes zc-para{from{transform:translateY(46px)}to{transform:translateY(-46px)}}\n  @keyframes zc-wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n  @keyframes zc-spin{to{transform:rotate(360deg)}}\n\n  .zc-route{stroke-dasharray:1;stroke-dashoffset:0;}\n  .zc-compass{transform-origin:50% 50%;}\n\n  @supports (animation-timeline: view()){\n   @media (prefers-reduced-motion: no-preference){\n    .zc-rise{animation:zc-rise linear both;animation-timeline:view();animation-range:entry 4% cover 24%;}\n    .zc-fade{animation:zc-fade linear both;animation-timeline:view();animation-range:entry 2% cover 20%;}\n    .zc-para{animation:zc-para linear both;animation-timeline:view();animation-range:cover;}\n    .zc-rule-wipe{transform-origin:left center;animation:zc-wipe linear both;animation-timeline:view();animation-range:entry 10% cover 30%;}\n    .zc-stag>*{animation:zc-rise linear both;animation-timeline:view();}\n    .zc-stag>*:nth-child(1){animation-range:entry 3% cover 20%}\n    .zc-stag>*:nth-child(2){animation-range:entry 6% cover 24%}\n    .zc-stag>*:nth-child(3){animation-range:entry 9% cover 28%}\n    .zc-stag>*:nth-child(4){animation-range:entry 12% cover 32%}\n    .zc-stag>*:nth-child(5){animation-range:entry 15% cover 36%}\n    .zc-stag>*:nth-child(6){animation-range:entry 18% cover 40%}\n    .zc-route{stroke-dashoffset:1;animation:zc-draw linear both;animation-timeline:view();animation-range:entry 25% cover 78%;}\n    .zc-wp{animation:zc-pop cubic-bezier(.2,.8,.3,1) both;animation-timeline:view();}\n    .zc-wp1{animation-range:entry 34% cover 40%}\n    .zc-wp2{animation-range:entry 46% cover 52%}\n    .zc-wp3{animation-range:entry 58% cover 64%}\n    .zc-wp4{animation-range:entry 72% cover 78%}\n    .zc-compass{animation:zc-spin 120s linear infinite;}\n   }\n  }\n\n  /* \u2500\u2500 Interaction \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .zc-btn{transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .25s ease,background .2s ease;}\n  .zc-btn:hover{transform:translateY(-2px);background:var(--oxblood) !important;color:var(--cream) !important;box-shadow:0 3px 7px rgba(20,30,51,.22),0 16px 30px -10px rgba(126,42,32,.6) !important;}\n  .zc-ghostbtn{transition:transform .2s cubic-bezier(.2,.7,.3,1),background .2s ease,border-color .2s ease;}\n  .zc-ghostbtn:hover{transform:translateY(-2px);background:var(--sand) !important;}\n  .zc-row{transition:background .25s ease;}\n  .zc-row:hover{background:rgba(20,30,51,.035);}\n  .zc-lift{transition:transform .4s cubic-bezier(.2,.7,.3,1),filter .4s ease;}\n  .zc-lift:hover{transform:translateY(-6px);}\n  .zc-menuitem{transition:background .2s ease;}\n  .zc-menuitem:hover{background:var(--sand);}\n  .zc-tab{transition:background .2s ease,color .2s ease;}\n  .zc-link{transition:opacity .2s ease;}\n  .zc-link:hover{opacity:1 !important;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column;background:#F4EBDA;position:relative;\">\n\n  <!-- NAV -->\n  <nav style=\"position:sticky;top:0;z-index:50;background:#141E33;color:#F4EBDA;display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:70px;\">\n    <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;\">\n      <svg width=\"24\" height=\"31\" sc-camel-view-box=\"0 0 44 56\" fill=\"none\"><path d=\"M2 54 L2 20 C2 11 8 7.5 13 5.8 C18 4 20.5 3.3 22 0.5 C23.5 3.3 26 4 31 5.8 C36 7.5 42 11 42 20 L42 54 Z\" stroke=\"#F4EBDA\" stroke-width=\"2.5\" fill=\"none\"><\u002Fpath><path d=\"M22 24 L24.4 31.6 L32 34 L24.4 36.4 L22 44 L19.6 36.4 L12 34 L19.6 31.6 Z\" fill=\"#EFA63A\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-family:'Fraunces',serif;font-weight:700;font-size:21px;letter-spacing:.18em;\">ZOCO<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:34px;font-size:14.5px;font-weight:500;\">\n      <span sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;color:{{ navHomeColor }};padding:6px 0;border-bottom:1.5px solid {{ navHomeBorder }};\">Our Story<\u002Fspan>\n      <div sc-camel-on-mouse-enter=\"{{ openFood }}\" sc-camel-on-mouse-leave=\"{{ closeFood }}\" style=\"position:relative;\">\n        <span sc-camel-on-click=\"{{ goMenu }}\" style=\"cursor:pointer;color:{{ navFoodColor }};padding:6px 0;border-bottom:1.5px solid {{ navFoodBorder }};\">The Food \u25be<\u002Fspan>\n        <sc-if value=\"{{ foodOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;top:100%;left:-16px;padding-top:10px;\">\n            <div style=\"background:#F4EBDA;border:1px solid #141E33;min-width:198px;padding:6px;display:flex;flex-direction:column;\">\n              <span class=\"zc-menuitem\" sc-camel-on-click=\"{{ goMenu }}\" style=\"cursor:pointer;color:#141E33;padding:10px 14px;\" style-hover=\"background:#E8DAC0;\">Menu<\u002Fspan>\n              <span class=\"zc-menuitem\" sc-camel-on-click=\"{{ goSignature }}\" style=\"cursor:pointer;color:#141E33;padding:10px 14px;\" style-hover=\"background:#E8DAC0;\">Signature Dishes<\u002Fspan>\n              <span class=\"zc-menuitem\" sc-camel-on-click=\"{{ goSauces }}\" style=\"cursor:pointer;color:#141E33;padding:10px 14px;\" style-hover=\"background:#E8DAC0;\">The Sauces<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <span sc-camel-on-click=\"{{ goAbout }}\" style=\"cursor:pointer;color:{{ navAboutColor }};padding:6px 0;border-bottom:1.5px solid {{ navAboutBorder }};\">About<\u002Fspan>\n      <span sc-camel-on-click=\"{{ goCareers }}\" style=\"cursor:pointer;color:{{ navCareersColor }};padding:6px 0;border-bottom:1.5px solid {{ navCareersBorder }};\">Careers<\u002Fspan>\n      <a class=\"zc-btn\" href=\"https://www.swiggy.com\" target=\"_blank\" style=\"background:#B0532F;color:#F4EBDA;padding:10px 24px;border-radius:999px;font-weight:600;font-size:14.5px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 18px -7px rgba(176,83,47,.8);\" style-hover=\"background:#7E2A20;color:#F4EBDA;\">Order now<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 HOME \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <main data-screen-label=\"Our Story (Home)\" style=\"flex:1;\">\n\n      <!-- HERO -->\n      <section style=\"position:relative;max-width:1240px;margin:0 auto;padding:96px 48px 104px;display:grid;grid-template-columns:1fr 440px;gap:80px;align-items:center;\">\n        <div class=\"zc-graticule\" style=\"position:absolute;inset:0;pointer-events:none;\"><\u002Fdiv>\n        <div style=\"position:relative;\">\n          <div class=\"zc-eyebrow zc-fade\">Middle Eastern \u00d7 Mexican \u00b7 Hyderabad<\u002Fdiv>\n          <h1 class=\"zc-h zc-rise\" style=\"font-size:56px;margin:0 0 28px;\">Shawarma tacos,<span class=\"l2\">za'atar quesadillas.<\u002Fspan><\u002Fh1>\n          <div class=\"zc-rule-wipe\" style=\"height:1.5px;background:#141E33;opacity:.35;max-width:470px;margin:0 0 26px;\"><\u002Fdiv>\n          <p class=\"zc-rise\" style=\"font-size:18.5px;line-height:1.62;max-width:490px;margin:0 0 18px;\">Garlicky, smoky, citrus-heavy food from two kitchens that turn out to share a pantry. Cooked over charcoal in Hyderabad, delivered hot across the city.<\u002Fp>\n          <p class=\"zc-rise\" style=\"font-size:16.5px;line-height:1.62;max-width:490px;margin:0 0 38px;opacity:.8;\">The two cuisines have more in common than most people expect. The taco al pastor was invented in Puebla in the 1930s by Lebanese immigrants cooking shawarma with what they could find locally.<\u002Fp>\n          <div class=\"zc-rise\" style=\"display:flex;gap:14px;align-items:center;margin-bottom:42px;\">\n            <a class=\"zc-btn\" href=\"https://www.swiggy.com\" target=\"_blank\" style=\"background:#B0532F;color:#F4EBDA;padding:15px 32px;border-radius:999px;font-weight:600;font-size:16px;box-shadow:0 2px 4px rgba(20,30,51,.2),0 12px 26px -9px rgba(176,83,47,.75);\" style-hover=\"background:#7E2A20;color:#F4EBDA;\">Order on Swiggy<\u002Fa>\n            <span class=\"zc-ghostbtn\" sc-camel-on-click=\"{{ scrollStory }}\" style=\"cursor:pointer;color:#141E33;padding:15px 30px;border-radius:999px;border:1.5px solid #141E33;font-weight:600;font-size:16px;\" style-hover=\"background:#E8DAC0;\">Follow the route<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"zc-fade\" style=\"display:flex;gap:20px;font-size:13px;font-weight:500;letter-spacing:.04em;opacity:.7;border-top:1px solid rgba(20,30,51,.3);padding-top:18px;max-width:490px;\">\n            <span>100% HALAL<\u002Fspan><span>\u00b7<\u002Fspan><span>BEIRUT \u00d7 MEXICO CITY<\u002Fspan><span>\u00b7<\u002Fspan><span>EST. 2026<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"zc-lift zc-para\" style=\"position:relative;width:440px;height:552px;justify-self:end;filter:drop-shadow(0 22px 40px rgba(20,30,51,.26)) drop-shadow(0 4px 9px rgba(20,30,51,.12));\">\n          <div class=\"zc-slot\" style=\"position:absolute;inset:0;clip-path:path('M0 552 L0 188 C0 99 60 61 120 41 C175 24 203 33 220 0 C237 33 265 24 320 41 C380 61 440 99 440 188 L440 552 Z');\"><\u002Fdiv>\n          <image-slot id=\"hero-food\" mask=\"path('M0 552 L0 188 C0 99 60 61 120 41 C175 24 203 33 220 0 C237 33 265 24 320 41 C380 61 440 99 440 188 L440 552 Z')\" placeholder=\"Hero dish photo\" style=\"width:440px;height:552px;\"><\u002Fimage-slot>\n          <svg width=\"440\" height=\"552\" sc-camel-view-box=\"0 0 440 552\" fill=\"none\" style=\"position:absolute;inset:0;pointer-events:none;\"><path d=\"M1 552 L1 188 C1 100 60.5 62 120.5 42 C175.5 25 204 34 220 3 C236 34 264.5 25 319.5 42 C379.5 62 439 100 439 188 L439 552\" stroke=\"#141E33\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- THE ROUTE / MAP -->\n      <section id=\"story\" style=\"background:#E8DAC0;border-top:1px solid rgba(20,30,51,.35);border-bottom:1px solid rgba(20,30,51,.35);padding:92px 0 84px;overflow:hidden;position:relative;\">\n        <div class=\"zc-ghost\" style=\"position:absolute;right:-40px;top:40px;font-size:200px;color:rgba(20,30,51,.035);letter-spacing:.04em;\">ZOCO<\u002Fdiv>\n        <div style=\"max-width:1240px;margin:0 auto;padding:0 48px;position:relative;\">\n          <div class=\"zc-eyebrow zc-fade\">The route<\u002Fdiv>\n          <h2 class=\"zc-h zc-rise\" style=\"font-size:44px;margin:0 0 22px;\">A word that traveled<span class=\"l2\">from souk to zoco.<\u002Fspan><\u002Fh2>\n          <div class=\"zc-rise\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:56px;max-width:900px;margin:0 0 20px;\">\n            <p style=\"font-size:16.5px;line-height:1.68;margin:0;\"><em>Zoco<\u002Fem> is the Spanish word for marketplace. It comes from the Arabic <em>souk<\u002Fem>, one of several thousand Arabic words that entered Spanish during the seven centuries of Al-Andalus, along with cumin, saffron, citrus and sugar.<\u002Fp>\n            <p style=\"font-size:16.5px;line-height:1.68;margin:0;\">Spain carried that pantry to Mexico in the 1500s, where it met chili and corn. Four hundred years later, Lebanese families arriving in Puebla found the combination already waiting for them.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- MAP -->\n        <div style=\"position:relative;width:100%;margin:26px 0 0;\">\n L-4 4 L-15 0 L-4 -4 Z\" fill=\"#EFA63A\"><\u002Fpath><text x=\"-20\" y=\"-14\" text-anchor=\"end\" font-family=\"Figtree,sans-serif\" font-size=\"15\" font-weight=\"600\" letter-spacing=\"1.6\" fill=\"#141E33\">HYDERABAD<\u002Ftext><text x=\"-20\" y=\"5\" text-anchor=\"end\" font-family=\"'Space Grotesk',sans-serif\" font-size=\"13\" fill=\"#B0532F\">2026<\u002Ftext><\u002Fg>\n            <\u002Fg>\n          <\u002Fsvg>\n        <\u002Fdiv>\n\n        <div style=\"max-width:1240px;margin:14px auto 0;padding:0 48px;\">\n          <div class=\"zc-stag\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:34px;\">\n            <sc-for list=\"{{ timeline }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"border-top:1px solid rgba(20,30,51,.32);padding-top:16px;\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;color:#B0532F;margin-bottom:6px;\">{{ t.date }}<\u002Fdiv>\n                <div style=\"font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin-bottom:9px;\">{{ t.place }}<\u002Fdiv>\n                <p style=\"font-size:14.5px;line-height:1.6;margin:0;\">{{ t.text }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SIGNATURE -->\n      <section style=\"max-width:1240px;margin:0 auto;padding:104px 48px;display:grid;grid-template-columns:370px 1fr;gap:80px;align-items:center;\">\n        <div class=\"zc-lift zc-para\" style=\"position:relative;width:370px;height:452px;filter:drop-shadow(0 18px 34px rgba(20,30,51,.22)) drop-shadow(0 4px 8px rgba(20,30,51,.1));\">\n          <div class=\"zc-slot\" style=\"position:absolute;inset:0;clip-path:path('M0 452 L0 154 C0 81 51 50 102 34 C149 19 172 27 185 0 C198 27 221 19 268 34 C319 50 370 81 370 154 L370 452 Z');\"><\u002Fdiv>\n          <image-slot id=\"home-signature\" mask=\"path('M0 452 L0 154 C0 81 51 50 102 34 C149 19 172 27 185 0 C198 27 221 19 268 34 C319 50 370 81 370 154 L370 452 Z')\" placeholder=\"Chicken Shawarma Tacos photo\" style=\"width:370px;height:452px;\"><\u002Fimage-slot>\n          <svg width=\"370\" height=\"452\" sc-camel-view-box=\"0 0 370 452\" fill=\"none\" style=\"position:absolute;inset:0;pointer-events:none;\"><path d=\"M1 452 L1 154 C1 82 52 51 102.5 35 C149.5 20 172.5 28 185 2 C197.5 28 220.5 20 267.5 35 C318 51 369 82 369 154 L369 452\" stroke=\"#141E33\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div class=\"zc-eyebrow zc-fade\">The signature<\u002Fdiv>\n          <h2 class=\"zc-h zc-rise\" style=\"font-size:44px;margin:0 0 22px;\">Chicken<span class=\"l2\">Shawarma Tacos<\u002Fspan><\u002Fh2>\n          <p class=\"zc-rise\" style=\"font-size:17px;line-height:1.68;max-width:560px;margin:0 0 16px;\">Garlic first, then smoke, then a sharp hit of pickled onion at the end. The chicken is dark and crisp at the edges, the toum is cold and thick against it, and the tortilla is soft enough to fold without cracking.<\u002Fp>\n          <p class=\"zc-rise\" style=\"font-size:17px;line-height:1.68;max-width:560px;margin:0 0 30px;opacity:.82;\">This is the dish the rest of the menu is built around, and the one closest to the original that started all of it.<\u002Fp>\n          <sc-if value=\"{{ showMacros }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"zc-rise\" style=\"display:flex;gap:0;margin-bottom:34px;max-width:520px;border-top:1px solid rgba(20,30,51,.32);border-bottom:1px solid rgba(20,30,51,.32);\">\n              <div style=\"flex:1;padding:14px 0;border-right:1px solid rgba(20,30,51,.18);\"><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;\">42g<\u002Fdiv><div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:2px;\">Protein<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;padding:14px 0 14px 18px;border-right:1px solid rgba(20,30,51,.18);\"><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;\">46g<\u002Fdiv><div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:2px;\">Carbs<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;padding:14px 0 14px 18px;border-right:1px solid rgba(20,30,51,.18);\"><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;\">21g<\u002Fdiv><div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:2px;\">Fat<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;padding:14px 0 14px 18px;\"><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;\">545<\u002Fdiv><div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:2px;\">kcal<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <span class=\"zc-btn zc-rise\" sc-camel-on-click=\"{{ goMenu }}\" style=\"cursor:pointer;display:inline-block;background:#B0532F;color:#F4EBDA;padding:15px 32px;border-radius:999px;font-weight:600;font-size:16px;box-shadow:0 2px 4px rgba(20,30,51,.2),0 12px 26px -9px rgba(176,83,47,.75);\" style-hover=\"background:#7E2A20;\">See the full menu<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- CRAFT -->\n      <section style=\"background:#152A52;color:#F4EBDA;padding:96px 48px;position:relative;overflow:hidden;\">\n        <div class=\"zc-ghost\" style=\"position:absolute;left:-30px;bottom:-56px;font-size:190px;color:rgba(244,235,218,.04);\">SOUK<\u002Fdiv>\n        <div style=\"max-width:1240px;margin:0 auto;position:relative;\">\n          <div class=\"zc-eyebrow zc-fade\" style=\"color:#EFA63A;\">The craft<\u002Fdiv>\n          <h2 class=\"zc-h zc-rise\" style=\"font-size:44px;margin:0 0 20px;color:#F4EBDA;\">How the kitchen<span class=\"l2\" style=\"color:#EFA63A;\">runs<\u002Fspan><\u002Fh2>\n          <p class=\"zc-rise\" style=\"font-size:16.5px;line-height:1.68;max-width:600px;margin:0 0 54px;opacity:.86;\">Four things that shape how the food tastes when it reaches you.<\u002Fp>\n          <div class=\"zc-stag\" style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:0 60px;\">\n            <sc-for list=\"{{ craft }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"border-top:1px solid rgba(244,235,218,.28);padding:26px 0 34px;\">\n                <div class=\"zc-num\" style=\"color:#EFA63A;\">{{ c.num }}<\u002Fdiv>\n                <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:12px 0 12px;color:#F4EBDA;\">{{ c.title }}<\u002Fh3>\n                <p style=\"font-size:15.5px;line-height:1.68;margin:0;opacity:.85;max-width:460px;\">{{ c.text }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- DOORS -->\n      <section style=\"padding:96px 48px 108px;\">\n        <div class=\"zc-stag\" style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:0;\">\n          <sc-for list=\"{{ doors }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <div class=\"zc-row\" sc-camel-on-click=\"{{ d.onOpen }}\" style=\"cursor:pointer;padding:0 40px 0 0;border-top:1.5px solid #141E33;padding-top:26px;margin-right:40px;\">\n              <svg width=\"46\" height=\"30\" sc-camel-view-box=\"0 0 46 30\" fill=\"none\" style=\"display:block;margin-bottom:18px;\"><path d=\"M1 30 L1 12 C1 7 6 4.6 11 3 C15 1.6 17 1 23 0.5 C29 1 31 1.6 35 3 C40 4.6 45 7 45 12 L45 30\" stroke=\"#141E33\" stroke-width=\"1.3\" fill=\"{{ d.paneFill }}\" fill-opacity=\".14\"><\u002Fpath><\u002Fsvg>\n              <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:23px;margin:0 0 12px;\">{{ d.title }}<\u002Fh3>\n              <p style=\"font-size:15.5px;line-height:1.62;margin:0 0 18px;\">{{ d.text }}<\u002Fp>\n C227 32 255 23 307 40 C364 59 422 95 422 182 L422 532 Z');\"><\u002Fdiv>\n            <image-slot id=\"{{ dish.slotId }}\" mask=\"path('M0 532 L0 182 C0 95 58 59 115 40 C167 23 195 32 211 0 C227 32 255 23 307 40 C364 59 422 95 422 182 L422 532 Z')\" placeholder=\"{{ dish.placeholder }}\" style=\"width:422px;height:532px;\"><\u002Fimage-slot>\n            <svg width=\"422\" height=\"532\" sc-camel-view-box=\"0 0 422 532\" fill=\"none\" style=\"position:absolute;inset:0;pointer-events:none;\"><path d=\"M1 532 L1 182 C1 96 58.5 60 115.5 41 C167.5 24 195.5 33 211 2 C226.5 33 254.5 24 306.5 41 C363.5 60 421 96 421 182 L421 532\" stroke=\"#141E33\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding-top:44px;\">\n          <h1 class=\"zc-h zc-rise\" style=\"font-size:44px;margin:0 0 12px;\">{{ dish.name }}<\u002Fh1>\n          <div class=\"zc-fade\" style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.68;margin-bottom:22px;\">{{ dish.serves }}<\u002Fdiv>\n          <p class=\"zc-rise\" style=\"font-size:17px;line-height:1.68;max-width:540px;margin:0 0 16px;\">{{ dish.story }}<\u002Fp>\n          <p class=\"zc-rise\" style=\"font-size:16.5px;line-height:1.68;max-width:540px;margin:0 0 36px;opacity:.85;\">{{ dish.method }}<\u002Fp>\n          <sc-if value=\"{{ showMacros }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"zc-eyebrow\">Macros per serving<\u002Fdiv>\n            <div class=\"zc-rise\" style=\"display:grid;grid-template-columns:repeat(4,1fr);max-width:540px;margin:0 0 38px;border-top:1.5px solid #141E33;border-bottom:1.5px solid #141E33;\">\n              <sc-for list=\"{{ dish.macroBlocks }}\" as=\"m\" hint-placeholder-count=\"4\">\n                <div style=\"padding:18px 12px;border-right:1px solid rgba(20,30,51,.2);\">\n                  <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:25px;\">{{ m.value }}<\u002Fdiv>\n                  <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:3px;\">{{ m.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"max-width:560px;margin-bottom:38px;\">\n            <div class=\"zc-eyebrow\">What's inside<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:0 22px;font-size:14.5px;line-height:2;\">\n              <sc-for list=\"{{ dish.inside }}\" as=\"ing\" hint-placeholder-count=\"5\"><span>{{ ing }}<\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:44px;font-size:14px;line-height:1.6;margin-top:22px;border-top:1px solid rgba(20,30,51,.24);padding-top:16px;\">\n              <div><span style=\"font-weight:600;\">Allergens \u00b7 <\u002Fspan>{{ dish.allergens }}<\u002Fdiv>\n              <div><span style=\"font-weight:600;\">Pairs with \u00b7 <\u002Fspan>{{ dish.pairs }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <a class=\"zc-btn\" href=\"https://www.swiggy.com\" target=\"_blank\" style=\"display:inline-block;background:#B0532F;color:#F4EBDA;padding:15px 34px;border-radius:999px;font-weight:600;font-size:16px;box-shadow:0 2px 4px rgba(20,30,51,.2),0 12px 26px -9px rgba(176,83,47,.75);\" style-hover=\"background:#7E2A20;color:#F4EBDA;\">Order this on Swiggy<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SAUCES \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <sc-if value=\"{{ isSauces }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"The Sauces\" style=\"flex:1;max-width:1100px;margin:0 auto;padding:80px 48px 100px;width:100%;box-sizing:border-box;\">\n      <div class=\"zc-eyebrow zc-fade\">Made every morning<\u002Fdiv>\n      <h1 class=\"zc-h zc-rise\" style=\"font-size:52px;margin:0 0 22px;\">The Sauces<\u002Fh1>\n      <p class=\"zc-rise\" style=\"font-size:17.5px;line-height:1.65;max-width:640px;margin:0 0 12px;\">Six sauces, and between them they do most of the work on this menu.<\u002Fp>\n      <p class=\"zc-rise\" style=\"font-size:16px;line-height:1.65;max-width:640px;margin:0 0 54px;opacity:.8;\">Every order comes with sauce. Ask for extra cups and we will add them.<\u002Fp>\n      <div class=\"zc-stag\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:0 60px;\">\n        <sc-for list=\"{{ sauces }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <div style=\"border-top:1px solid rgba(20,30,51,.28);padding:26px 0 32px;\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px;\">\n              <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 0 L15 9 L24 12 L15 15 L12 24 L9 15 L0 12 L9 9 Z\" fill=\"{{ s.starFill }}\"><\u002Fpath><\u002Fsvg>\n              <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0;\">{{ s.name }}<\u002Fh3>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#B0532F;margin:0 0 12px 23px;\">{{ s.tag }}<\u002Fdiv>\n            <p style=\"font-size:15.5px;line-height:1.65;margin:0 0 14px 23px;max-width:400px;\">{{ s.text }}<\u002Fp>\n            <div style=\"font-size:13px;margin-left:23px;opacity:.68;\">Goes on \u00b7 {{ s.goes }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"zc-rise\" style=\"margin-top:56px;background:#2C4A77;color:#F4EBDA;padding:44px 48px;\">\n        <h2 class=\"zc-h\" style=\"font-size:26px;margin:0 0 12px;color:#F4EBDA;\">All six are made here<\u002Fh2>\n        <p style=\"font-size:16.5px;line-height:1.68;margin:0;opacity:.9;max-width:720px;\">Every sauce on this page is made in our own kitchen each morning, in small batches. If one runs out during service, that is the reason.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 ABOUT \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"About\" style=\"flex:1;\">\n      <section style=\"max-width:1060px;margin:0 auto;padding:80px 48px 60px;position:relative;\">\n        <div class=\"zc-eyebrow zc-fade\">About Zoco<\u002Fdiv>\n        <h1 class=\"zc-h zc-rise\" style=\"font-size:52px;margin:0 0 24px;\">Where the food<span class=\"l2\">comes from<\u002Fspan><\u002Fh1>\n        <p class=\"zc-rise\" style=\"font-size:18px;line-height:1.65;max-width:660px;margin:0 0 16px;\">Zoco is a kitchen in Hyderabad cooking Middle Eastern and Mexican food. The two cuisines overlap far more than their reputations suggest.<\u002Fp>\n        <p class=\"zc-rise\" style=\"font-size:16.5px;line-height:1.65;max-width:660px;margin:0;opacity:.84;\">Both of them cook over charcoal, lean on citrus and garlic, wrap things in flatbread, put pickled onion on top and let a sauce do most of the work. Once you have eaten enough of both, the resemblance is hard to miss.<\u002Fp>\n      <\u002Fsection>\n      <section style=\"max-width:1240px;margin:0 auto;padding:0 48px 84px;\">\n        <div class=\"zc-stag\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:0 60px;\">\n          <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:1px solid rgba(20,30,51,.28);padding:26px 0 34px;\">\n              <div class=\"zc-num\">{{ p.num }}<\u002Fdiv>\n              <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:12px 0 12px;\">{{ p.title }}<\u002Fh3>\n              <p style=\"font-size:15.5px;line-height:1.68;margin:0;max-width:460px;\">{{ p.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"background:#E8DAC0;border-top:1px solid rgba(20,30,51,.32);border-bottom:1px solid rgba(20,30,51,.32);padding:92px 48px;position:relative;overflow:hidden;\">\n        <div class=\"zc-ghost\" style=\"position:absolute;right:-20px;top:20px;font-size:170px;color:rgba(20,30,51,.04);\">2026<\u002Fdiv>\n        <div style=\"max-width:1060px;margin:0 auto;position:relative;\">\n          <div class=\"zc-eyebrow zc-fade\">From the founder<\u002Fdiv>\n          <h2 class=\"zc-h zc-rise\" style=\"font-size:42px;margin:0 0 30px;\">Why this,<span class=\"l2\">and why here<\u002Fspan><\u002Fh2>\n          <div class=\"zc-rise\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:52px;max-width:960px;\">\n            <div>\n              <p style=\"font-size:17px;line-height:1.7;margin:0 0 20px;\">I didn't grow up cooking this food. I travelled a lot, ate constantly, and kept noticing that the shawarma counter and the taquer\u00eda were selling versions of the same thing.<\u002Fp>\n              <p style=\"font-size:17px;line-height:1.7;margin:0;\">Hyderabad is a serious eating city. There is biryani worth flying for, Irani chai at two in the morning, and real enthusiasm for anything cooked over fire. What I could never find here was Middle Eastern and Mexican food done properly, in one place.<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size:17px;line-height:1.7;margin:0 0 20px;\">So Zoco started as an experiment and stayed one for a long time. I like playing with food, so I cooked a lot of versions of these dishes and threw most of them away.<\u002Fp>\n              <p style=\"font-size:17px;line-height:1.7;margin:0;\">What is on the menu now is what I would order myself. We are staying small for the moment, which means I taste everything that goes out.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"background:#2C4A77;color:#F4EBDA;padding:88px 48px;\">\n        <div style=\"max-width:1060px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:54px;align-items:center;\">\n          <svg width=\"84\" height=\"107\" sc-camel-view-box=\"0 0 44 56\" fill=\"none\" class=\"zc-fade\"><path d=\"M2 54 L2 20 C2 11 8 7.5 13 5.8 C18 4 20.5 3.3 22 0.5 C23.5 3.3 26 4 31 5.8 C36 7.5 42 11 42 20 L42 54 Z\" stroke=\"#F4EBDA\" stroke-width=\"1.4\" fill=\"none\"><\u002Fpath><path d=\"M22 24 L24.4 31.6 L32 34 L24.4 36.4 L22 44 L19.6 36.4 L12 34 L19.6 31.6 Z\" fill=\"#EFA63A\"><\u002Fpath><\u002Fsvg>\n          <div>\n            <div class=\"zc-eyebrow zc-fade\" style=\"color:#EFA63A;\">The Halal Promise<\u002Fdiv>\n            <h2 class=\"zc-h zc-rise\" style=\"font-size:34px;margin:0 0 16px;color:#F4EBDA;line-height:1.18;\">The whole kitchen<span class=\"l2\" style=\"color:#EFA63A;\">is halal<\u002Fspan><\u002Fh2>\n            <p class=\"zc-rise\" style=\"font-size:16.5px;line-height:1.7;margin:0 0 14px;max-width:660px;opacity:.92;\">Every supplier is certified and every delivery is checked. There is no pork or beef on the premises at any point, in any fridge, on any shift.<\u002Fp>\n            <p class=\"zc-rise\" style=\"font-size:16.5px;line-height:1.7;margin:0;max-width:660px;opacity:.85;\">There is one menu here, and everybody who orders is eating from it.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:1060px;margin:0 auto;padding:88px 48px 100px;\">\n        <div class=\"zc-eyebrow zc-fade\">The Kitchen<\u002Fdiv>\n        <p class=\"zc-rise\" style=\"font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1.5;max-width:800px;margin:0 0 20px;\">Zoco cooks one menu out of one kitchen, and everything on it is made on site. No central commissary, no shipped-in sauce.<\u002Fp>\n        <p class=\"zc-rise\" style=\"font-size:17px;line-height:1.65;max-width:700px;margin:0;\">We are building the founding kitchen team now. Trial days are paid and terms are stated upfront in writing. <span sc-camel-on-click=\"{{ goCareers }}\" style=\"cursor:pointer;color:#B0532F;font-weight:600;border-bottom:1.5px solid #B0532F;\">See open roles<\u002Fspan>.<\u002Fp>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 CAREERS \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <sc-if value=\"{{ isCareers }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Careers\" style=\"flex:1;\">\n      <section style=\"max-width:1060px;margin:0 auto;padding:80px 48px 56px;\">\n        <div class=\"zc-eyebrow zc-fade\">Careers<\u002Fdiv>\n        <h1 class=\"zc-h zc-rise\" style=\"font-size:48px;margin:0 0 22px;line-height:1.1;\">Join the founding<span class=\"l2\">kitchen team.<\u002Fspan><\u002Fh1>\n        <p class=\"zc-rise\" style=\"font-size:17.5px;line-height:1.65;max-width:620px;margin:0 0 14px;\">Eighteen dishes, engineered and costed to gram-level recipe cards. Brand built, suppliers lined up, launch planned to the day. What happens next happens in the kitchen.<\u002Fp>\n        <p class=\"zc-rise\" style=\"font-size:16px;line-height:1.65;max-width:620px;margin:0 0 30px;opacity:.84;\">Come in at the start and you set the standard everyone after you cooks to.<\u002Fp>\n        <div style=\"display:flex;gap:0 26px;flex-wrap:wrap;font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid rgba(20,30,51,.28);border-bottom:1px solid rgba(20,30,51,.28);padding:14px 0;\">\n          <sc-for list=\"{{ careerBadges }}\" as=\"b\" hint-placeholder-count=\"5\"><span>{{ b }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:1240px;margin:0 auto;padding:26px 48px 76px;\">\n        <h2 class=\"zc-rise\" style=\"font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0 0 30px;\">Why cook at Zoco<\u002Fh2>\n        <div class=\"zc-stag\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:0 34px;\">\n          <sc-for list=\"{{ whyCards }}\" as=\"w\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:1px solid rgba(20,30,51,.28);padding:22px 0 30px;\">\n              <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0 0 10px;\">{{ w.title }}<\u002Fh3>\n              <p style=\"font-size:14px;line-height:1.62;margin:0;\">{{ w.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"background:#E8DAC0;border-top:1px solid rgba(20,30,51,.32);border-bottom:1px solid rgba(20,30,51,.32);padding:80px 48px;\">\n        <div style=\"max-width:1240px;margin:0 auto;\">\n          <h2 class=\"zc-rise\" style=\"font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0 0 32px;\">Open roles<\u002Fh2>\n          <div class=\"zc-stag\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0 44px;\">\n            <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"border-top:1.5px solid #141E33;padding:24px 0 0;display:flex;flex-direction:column;height:100%;\">\n                <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:23px;margin:0 0 4px;\">{{ r.title }}<\u002Fh3>\n                <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#B0532F;margin-bottom:14px;\">{{ r.pay }}<\u002Fdiv>\n                <p style=\"font-size:14.5px;line-height:1.62;margin:0 0 24px;flex:1;\">{{ r.text }}<\u002Fp>\n                <a class=\"zc-btn\" href=\"{{ r.wa }}\" target=\"_blank\" style=\"display:block;text-align:center;background:#B0532F;color:#F4EBDA;padding:12px 0;border-radius:999px;font-weight:600;font-size:15px;margin-bottom:6px;box-shadow:0 2px 4px rgba(20,30,51,.2),0 10px 22px -9px rgba(176,83,47,.75);\" style-hover=\"background:#7E2A20;color:#F4EBDA;\">Apply on WhatsApp<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#141E33;color:#F4EBDA;padding:60px 48px 44px;\">\n    <div style=\"max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:40px;flex-wrap:wrap;\">\n      <div style=\"max-width:300px;\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px;\">\n          <svg width=\"21\" height=\"27\" sc-camel-view-box=\"0 0 44 56\" fill=\"none\"><path d=\"M2 54 L2 20 C2 11 8 7.5 13 5.8 C18 4 20.5 3.3 22 0.5 C23.5 3.3 26 4 31 5.8 C36 7.5 42 11 42 20 L42 54 Z\" stroke=\"#F4EBDA\" stroke-width=\"2.5\" fill=\"none\"><\u002Fpath><path d=\"M22 24 L24.4 31.6 L32 34 L24.4 36.4 L22 44 L19.6 36.4 L12 34 L19.6 31.6 Z\" fill=\"#EFA63A\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:'Fraunces',serif;font-weight:700;font-size:18px;letter-spacing:.18em;\">ZOCO<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;opacity:.8;\">Where Beirut meets Mexico City<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;\">\n        <span class=\"zc-link\" sc-camel-on-click=\"{{ goMenu }}\" style=\"cursor:pointer;color:#F4EBDA;opacity:.82;\" style-hover=\"opacity:1;\">Menu<\u002Fspan>\n        <span class=\"zc-link\" sc-camel-on-click=\"{{ goSauces }}\" style=\"cursor:pointer;color:#F4EBDA;opacity:.82;\" style-hover=\"opacity:1;\">The Sauces<\u002Fspan>\n        <span class=\"zc-link\" sc-camel-on-click=\"{{ goAbout }}\" style=\"cursor:pointer;color:#F4EBDA;opacity:.82;\" style-hover=\"opacity:1;\">About<\u002Fspan>\n        <span class=\"zc-link\" sc-camel-on-click=\"{{ goCareers }}\" style=\"cursor:pointer;color:#F4EBDA;opacity:.82;\" style-hover=\"opacity:1;\">Careers<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;align-items:flex-end;\">\n        <a class=\"zc-link\" href=\"tel:+917207913443\" style=\"color:#F4EBDA;opacity:.82;\" style-hover=\"color:#F4EBDA;opacity:1;\">+91 72079 13443<\u002Fa>\n        <a class=\"zc-link\" href=\"https://wa.me/917207913443\" target=\"_blank\" style=\"color:#F4EBDA;opacity:.82;\" style-hover=\"color:#F4EBDA;opacity:1;\">WhatsApp: 72079 13443<\u002Fa>\n        <a class=\"zc-link\" href=\"mailto:zocokitchens@gmail.com\" style=\"color:#F4EBDA;opacity:.82;\" style-hover=\"color:#F4EBDA;opacity:1;\">zocokitchens@gmail.com<\u002Fa>\n        <a class=\"zc-link\" href=\"https://instagram.com/zocokitchens\" target=\"_blank\" style=\"color:#F4EBDA;opacity:.82;display:flex;align-items:center;gap:8px;\" style-hover=\"color:#F4EBDA;opacity:1;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"2\" y=\"2\" width=\"20\" height=\"20\" rx=\"6\" stroke=\"#F4EBDA\" stroke-width=\"1.8\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4.5\" stroke=\"#F4EBDA\" stroke-width=\"1.8\"><\u002Fcircle><circle cx=\"17.6\" cy=\"6.4\" r=\"1.3\" fill=\"#F4EBDA\"><\u002Fcircle><\u002Fsvg>@zocokitchens<\u002Fa>\n        <span style=\"opacity:.62;font-size:13px;\">Hyderabad<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showMacros&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Menu&quot;}, &quot;startPage&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;home&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;menu&quot;, &quot;signature&quot;, &quot;product&quot;, &quot;sauces&quot;, &quot;about&quot;, &quot;careers&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Navigation&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: this.props.startPage ?? 'home', dishKey: 'shawarma', menuCat: 'All', foodOpen: false };\n\n  go(page, extra) {\n    this.setState({ page, foodOpen: false, ...(extra || {}) });\n    window.scrollTo(0, 0);\n  }\n\n  renderVals() {\n    const S = this.state;\n    const showMacros = this.props.showMacros ?? true;\n    const chips = (p, c, f, kcal) => {\n      const out = [];\n      if (p) out.push('Protein ' + p);\n      if (c) out.push('Carbs ' + c);\n      if (f) out.push('Fat ' + f);\n      out.push(kcal + ' kcal');\n      return out;\n    };\n    const cats = [\n      { name: \"Tacos & Handhelds\",\n        intro: \"Soft corn tortillas, meat off the charcoal grill, and a sauce on every one. These are the dishes most people order first.\",\n        dishes: [\n        { name: \"Chicken Shawarma Tacos\", slotId: \"m-shawarma-tacos\", veg: false, page: 'shawarma', desc: \"Warm spice and lemon on dark, crisp-edged chicken, with cold garlic toum and enough pickled onion to keep it sharp. Rich, but it stays bright.\", macroChips: chips('42g', '46g', '21g', 545) },\n        { name: \"Lamb Birria Tacos\", slotId: \"m-birria-tacos\", veg: false, page: 'birria', desc: \"Deep, savoury lamb with a mild chili warmth and cinnamon behind it. Comes with a cup of broth for dipping, which makes it messy in the way it is supposed to be.\", macroChips: chips('38g', '44g', '28g', 590) },\n        { name: \"Harissa Grilled Chicken Tacos\", slotId: \"m-harissa-tacos\", veg: false, desc: \"Smoky and a little sweet from the harissa, with fresh green heat from the zhoug and cold, crunchy radish. The hottest thing on the taco list.\", macroChips: chips('40g', '42g', '17g', 490) },\n        { name: \"Prawn Tacos\", slotId: \"m-prawn-tacos\", veg: false, desc: \"Sweet charred prawns against a smoky chipotle salsa, cooled down with lime crema. Light enough that three is easy.\", macroChips: chips('32g', '40g', '16g', 435) },\n        { name: \"Lamb Kofta Tacos\", slotId: \"m-kofta-tacos\", veg: false, desc: \"Savoury and heavily spiced, with nutty tahini and a sharp bite of pickled cabbage. The most filling taco we make.\", macroChips: chips('35g', '42g', '26g', 555) },\n        { name: \"Falafel Tacos\", slotId: \"m-falafel-tacos\", veg: true, desc: \"Crunchy outside, soft and herby inside, with cool tahini and a lemony herb salad over the top.\", macroChips: chips('16g', '52g', '22g', 470) }\n      ]},\n      { name: \"Bowls & Quesadillas\",\n        intro: \"Heavier, cheesier, and easier to eat with a fork. Closer to a full meal than a snack.\",\n        dishes: [\n        { name: \"Mejadra Burrito Bowl\", slotId: \"m-mejadra-bowl\", veg: true, desc: \"Sweet caramelised onion running through soft rice and lentils, with roast vegetables and tahini. Mild, warm and comforting.\", macroChips: chips('18g', '68g', '18g', 505) },\n        { name: \"Za'atar Paneer Quesadilla\", slotId: \"m-paneer-quesadilla\", veg: true, page: 'quesadilla', desc: \"Salty, herby za'atar against three melted cheeses and firm paneer, with a green line of chili running through it. Very rich.\", macroChips: chips('28g', '44g', '30g', 560) },\n        { name: \"Chicken Shawarma Quesadilla\", slotId: \"m-shawarma-quesadilla\", veg: false, desc: \"The shawarma flavours in a crisp, cheesy fold. Garlicky, and messy in the hand.\", macroChips: chips('39g', '43g', '27g', 575) },\n        { name: \"Halloumi Street Corn\", slotId: \"m-halloumi-corn\", veg: true, desc: \"Salty grilled halloumi over sweet corn, with sumac and lime for sourness. Sweet and salty in equal measure.\", macroChips: chips('19g', '36g', '24g', 430) }\n      ]},\n      { name: \"Small Plates\",\n        intro: \"Things to start with, or to round out an order for two.\",\n        dishes: [\n        { name: \"Lamb Croquettes\", slotId: \"m-croquettes\", veg: false, desc: \"Crisp shell, soft spiced lamb inside, with a dark sour-sweet po braised lamb shoulder\", \"corn tortillas\", \"dipping consomm\u00e9\", \"pistachio\", \"pickled onion\"],\n        allergens: \"nuts (pistachio), garlic\",\n        pairs: \"Mint Limonada, Chicken Adana Skewers\" },\n      quesadilla: { name: \"Za'atar Paneer Quesadilla\", serves: \"Serves 1\", slotId: \"dish-quesadilla\",\n        placeholder: \"Za'atar Paneer Quesadilla photo\",\n        story: \"Paneer is Hyderabadi, za'atar is Levantine, the tortilla is Mexican. This is the dish where all three parts of Zoco sit most obviously in the same place.\",\n        method: \"Salty and herby from the za'atar, rich from three melted cheeses, with firm paneer giving it something to bite against and a green line of zhoug for heat. The richest thing on the menu.\",\n        macroBlocks: [\n          { label: \"Protein\", value: \"28g\", bg: \"#EFA63A\" },\n          { label: \"Carbs\", value: \"44g\", bg: \"#E8DAC0\" },\n          { label: \"Fat\", value: \"30g\", bg: \"#E8DAC0\" },\n          { label: \"Energy\", value: \"560 kcal\", bg: \"#E8DAC0\" }\n        ],\n        inside: [\"charred paneer\", \"za'atar\", \"three cheeses\", \"zhoug\", \"flour tortilla\"],\n        allergens: \"dairy, gluten, sesame (za'atar)\",\n        pairs: \"Jamaica Agua Fresca, Rose Milk\" }\n    };\n    const tabNames = [\"All\", \"Tacos & Handhelds\", \"Bowls & Quesadillas\", \"Small Plates\", \"Sweet\", \"Drinks\"];\n    const menuTabs = tabNames.map(name => ({\n      name,\n      bg: S.menuCat === name ? '#141E33' : '#F4EBDA',\n      color: S.menuCat === name ? '#F4EBDA' : '#141E33',\n      shadow: S.menuCat === name\n        ? '0 2px 5px rgba(20,30,51,.22), 0 10px 22px -8px rgba(20,30,51,.5)'\n        : '0 1px 2px rgba(20,30,51,.07), 0 5px 12px -6px rgba(20,30,51,.18)',\n      onClick: () => this.setState({ menuCat: name })\n    }));\n    const menuCats = (S.menuCat === 'All' ? cats : cats.filter(c => c.name === S.menuCat)).map(c => ({\n      name: c.name,\n      intro: c.intro,\n      dishes: c.dishes.map(d => ({ ...d, hasPage: !!d.page, onOpen: d.page ? (() => this.go('product', { dishKey: d.page })) : null }))\n    }));\n    const navColor = (active) => active ? '#EFA63A' : '#F4EBDA';\n    const navBorder = (active) => active ? '#EFA63A' : 'transparent';\n    const isFood = ['menu', 'signature', 'product', 'sauces'].includes(S.page);\n    return {\n      showMacros,\n      isHome: S.page === 'home', isMenu: S.page === 'menu', isSignature: S.page === 'signature',\n      isProduct: S.page === 'product', isSauces: S.page === 'sauces', isAbout: S.page === 'about', isCareers: S.page === 'careers',\n      foodOpen: S.foodOpen,\n      openFood: () => this.setState({ foodOpen: true }),\n      closeFood: () => this.setState({ foodOpen: false }),\n      goHome: () => this.go('home'), goMenu: () => this.go('menu'), goSignature: () => this.go('signature'),\n      goSauces: () => this.go('sauces'), goAbout: () => this.go('about'), goCareers: () => this.go('careers'),\n      scrollStory: () => { const el = document.getElementById('story'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' }); },\n      navHomeColor: navColor(S.page === 'home'), navHomeBorder: navBorder(S.page === 'home'),\n      navFoodColor: navColor(isFood), navFoodBorder: navBorder(isFood),\n      navAboutColor: navColor(S.page === 'about'), navAboutBorder: navBorder(S.page === 'about'),\n      navCareersColor: navColor(S.page === 'careers'), navCareersBorder: navBorder(S.page === 'careers'),\n      timeline: [\n        { date: \"711\u20131492\", place: \"Al-Andalus\", text: \"Arabic enters Spanish over seven centuries. Souk becomes zoco, and Moorish tilework becomes azulejo. Cumin, saffron and citrus become Spanish staples.\", starFill: \"#B0532F\" },\n        { date: \"1521\u20131800s\", place: \"The crossing\", text: \"Spanish ships carry that pantry to Mexico, where chili and corn are already in wide use. The two food cultures start borrowing from each other almost at once.\", starFill: \"#B0532F\" },\n        { date: \"1930s\", place: \"Puebla, Mexico\", text: \"Lebanese families settle in Puebla and set up shawarma spits. With no lamb available they use pork, swap pita for tortilla and add achiote and chili. The taco al pastor comes out of it.\", starFill: \"#B0532F\" },\n        { date: \"2026\", place: \"Hyderabad\", text: \"Zoco opens cooking food from both ends of that story, with chicken and lamb back in place of the pork.\", starFill: \"#EFA63A\" }\n      ],\n      craft: [\n        { num: \"01\", title: \"Everything goes over charcoal\", text: \"The grill runs on charcoal rather than gas, and that is where the smoke in the chicken and the lamb comes from. You can taste it most clearly in the adana skewers and the harissa chicken.\" },\n        { num: \"02\", title: \"Tortillas are pressed to order\", text: \"Corn tortillas are pressed and cooked once your order comes in, so they reach you soft enough to fold. It is the main reason our tacos survive the ride.\" },\n        { num: \"03\", title: \"All six sauces are made here\", text: \"Toum, zhoug, salsa, tahini crema, pomegranate molasses and sumac onion are made in our kitchen every morning in small batches, and nothing is bought in.\" },\n        { num: \"04\", title: \"Every dish is weighed\", text: \"Each recipe is written down and weighed out rather than judged by eye, so what you order in March still tastes the same in September.\" }\n      ],\n      doors: [\n        { title: \"The Food\", text: \"Eighteen dishes across tacos, bowls, quesadillas, small plates and drinks.\", link: \"View the menu\", paneFill: \"#2C4A77\", onOpen: () => this.go('menu') },\n        { title: \"About Zoco\", text: \"Where the food comes from, and how the kitchen runs.\", link: \"Read more\", paneFill: \"#152A52\", onOpen: () => this.go('about') },\n        { title: \"Join the kitchen\", text: \"Founding kitchen roles, open now. Paid trial days and terms in writing.\", link: \"See open roles\", paneFill: \"#7E2A20\", onOpen: () => this.go('careers') }\n      ],\n      menuTabs, menuCats,\n      dish: dishes[S.dishKey] || dishes.shawarma,\n      signatureCards: [\n        { name: \"Chicken Shawarma Tacos\", slotId: \"sig-shawarma\", placeholder: \"Shawarma tacos photo\", blurb: \"Garlic, smoke and lemon, with pickled onion cutting through it.\", onOpen: () => this.go('product', { dishKey: 'shawarma' }) },\n        { name: \"Lamb Birria Tacos\", slotId: \"sig-birria\", placeholder: \"Birria tacos photo\", blurb: \"Deep and savoury, with mild chili warmth and broth to dip.\", onOpen: () => this.go('product', { dishKey: 'birria' }) },\n        { name: \"Za'atar Paneer Quesadilla\", slotId: \"sig-quesadilla\", placeholder: \"Paneer quesadilla photo\", blurb: \"Salty za'atar, three melted cheeses and a green line of chili.\", onOpen: () => this.go('product', { dishKey: 'quesadilla' }) }\n      ],\n      sauces: [\n        { name: \"Toum\", tag: \"garlic\", text: \"Pure garlic, thick and white, with a sharp lemon edge. Strong enough that a little goes a long way, and the sauce most people ask extra of.\", goes: \"shawarma tacos, adana skewers\", starFill: \"#B0532F\" },\n        { name: \"Zhoug\", tag: \"green heat\", text: \"Fresh green heat from coriander and green chili, with cardamom sitting behind it. The heat builds slowly instead of arriving all at once.\", goes: \"harissa chicken, paneer quesadilla\", starFill: \"#B0532F\" },\n        { name: \"Chipotle-tomato salsa\", tag: \"smoke\", text: \"Smoky and mildly sweet, with gentle heat and a good depth of tomato. The most versatile sauce on the list.\", goes: \"prawn tacos, street corn\", starFill: \"#B0532F\" },\n        { name: \"Tahini crema\", tag: \"sesame\", text: \"Cool, nutty and slightly sour from the lime. It softens anything fried and takes the edge off the heat.\", goes: \"falafel tacos, croquettes\", starFill: \"#B0532F\" },\n        { name: \"Pomegranate molasses\", tag: \"dark and sour\", text: \"Thick, dark and sour, with sweetness underneath. Good against rich meat.\", goes: \"lamb croquettes, kofta\", starFill: \"#B0532F\" },\n        { name: \"Sumac onion\", tag: \"sharp\", text: \"Soft pink onion, sour and salty. It sharpens whatever it goes on, which is why it ends up on most things.\", goes: \"adana skewers, shawarma, birria\", starFill: \"#EFA63A\" }\n      ],\n      pillars: [\n        { num: \"01\", title: \"The history is real\", text: \"Spanish absorbed thousands of Arabic words during Al-Andalus, and Lebanese immigrants in Puebla invented the taco al pastor in the 1930s. The combination already existed. Our job was to cook it properly.\" },\n        { num: \"02\", title: \"One standard, one menu\", text: \"Every supplier is certified and every ingredient is sourced to the same standard. Nothing on this menu is a compromise version of something else.\" },\n        { num: \"03\", title: \"The same every time\", text: \"Every dish is weighed against a recipe card before it goes out. What you order in March should taste the same in September, and that matters more in a kitchen you cannot see.\" },\n        { num: \"04\", title: \"Made for delivery\", text: \"Every dish was tested after twenty minutes in a delivery bag. Sauces travel in their own cups and tortillas are kept away from anything wet, so the food arrives close to how it left.\" }\n      ],\n      careerBadges: [\"Paid trial days\", \"Staff meals every shift\", \"Weekly off\"],\n      whyCards: [\n        { title: \"A founding role\", text: \"You are in at the start. The way the kitchen runs on day one is the way you decide to run it.\" },\n        { title: \"The recipes are ready\", text: \"Eighteen dishes, engineered and costed before you walk in. You cook to the cards and then improve them.\" },\n        { title: \"Real growth\", text: \"When Zoco opens more kitchens, the people who opened this one will run them.\" },\n        { title: \
